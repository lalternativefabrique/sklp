apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: acme-prod
resources:
  - ../../base
images:
  - name: rg.fr-par.scw.cloud/acme/core
    newTag: "20261120-0915-4a1b2c3"
  - name: rg.fr-par.scw.cloud/acme/web
    newTag: "20261120-0915-4a1b2c3"
  - name: rg.fr-par.scw.cloud/acme/migrate
    newTag: "20261120-0915-4a1b2c3"
patches:
  - target:
      kind: Deployment
      name: web
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
