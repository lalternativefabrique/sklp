apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: acme-secrets
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: scaleway
  target:
    name: acme-secrets
  data:
    - secretKey: MASTER_KEY
      remoteRef:
        key: name:acme-master-key
    - secretKey: SMTP_PASSWORD
      remoteRef:
        key: name:acme-smtp
