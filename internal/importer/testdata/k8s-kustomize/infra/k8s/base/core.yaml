apiVersion: v1
kind: Service
metadata:
  name: acme-core
spec:
  selector:
    app: acme-core
  ports:
    - name: http
      port: 4100
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: acme-core
  template:
    metadata:
      labels:
        app: acme-core
    spec:
      imagePullSecrets:
        - name: registry-credentials
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      initContainers:
        - name: migrate
          image: rg.fr-par.scw.cloud/acme/migrate:SET_BY_KUSTOMIZE
          args: ["-path", "/migrations", "-database", "$(DATABASE_URL)", "up"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: uri
      containers:
        - name: core
          image: rg.fr-par.scw.cloud/acme/core:SET_BY_KUSTOMIZE
          ports:
            - containerPort: 4100
              name: http
          envFrom:
            - configMapRef:
                name: acme-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-app
                  key: uri
            - name: MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: acme-secrets
                  key: MASTER_KEY
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: acme-secrets
                  key: SMTP_PASSWORD
                  optional: true
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 512Mi
