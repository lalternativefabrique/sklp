apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:17.4
  storage:
    size: 10Gi
  bootstrap:
    initdb:
      database: acme
      owner: acme
  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: 256MB
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: postgres-backup-daily
spec:
  schedule: "0 0 3 * * *"
  cluster:
    name: postgres
