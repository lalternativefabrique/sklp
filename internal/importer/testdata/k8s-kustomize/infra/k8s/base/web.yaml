apiVersion: v1
kind: Service
metadata:
  name: acme-web
spec:
  selector:
    app: acme-web
  ports:
    - name: http
      port: 80
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: acme-web
  template:
    metadata:
      labels:
        app: acme-web
    spec:
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - name: web
          image: rg.fr-par.scw.cloud/acme/web:SET_BY_KUSTOMIZE
          ports:
            - containerPort: 3000
          env:
            - name: CORE_URL
              value: http://acme-core.acme-prod.svc.cluster.local:4100
            - name: NODE_ENV
              value: production
          livenessProbe:
            tcpSocket:
              port: 3000
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: digest
spec:
  schedule: "0 7 * * *"
  timeZone: Europe/Paris
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: digest
              image: rg.fr-par.scw.cloud/acme/core:SET_BY_KUSTOMIZE
              args: ["digest", "--core", "http://acme-core:4100"]
