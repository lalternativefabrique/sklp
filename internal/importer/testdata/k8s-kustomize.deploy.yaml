# Imported for production from infra/k8s/overlays/production by `sklp init -from k8s -to deploy`.
# 3 manual action(s) left: grep TODO(import). Lines marked import: record a translation choice.
# import: secrets: ExternalSecret acme-secrets read from store scaleway: MASTER_KEY ← name:acme-master-key, SMTP_PASSWORD ← name:acme-smtp — copy each value into the matching variable
# import: registries: imagePullSecrets became registries: credentials for rg.fr-par.scw.cloud
# import: kinds: ConfigMap acme-config dropped: values were inlined where services read them
# import: kinds: ExternalSecret acme-secrets dropped: values are never copied: each one is a ${VAR} to set
# import: kinds: Middleware compress, redirect-https, security-headers dropped: compress/headers became route flags, redirects are the gateway's
# import: kinds: Namespace acme-prod dropped: a deploy runs in its own space
# import: kinds: NetworkPolicy default-deny dropped: a space is already isolated; use allow_egress for outbound rules
# import: kinds: PodDisruptionBudget core dropped: rollouts soak and roll back on their own
# import: kinds: ScheduledBackup postgres-backup-daily dropped: replaced by the nightly pg_dump
# import: gateway: the node gateway terminates TLS for every route with a Let's Encrypt certificate requested for ACME_EMAIL; point each route host's DNS at the node
# import: spaces: routes live in space k8s-kustomize-production: rename it to the space this deploy should own
# TODO(import): variables: sklp deploy refuses to start while one of these is unset (a git reconcile reads them from the Skalpai project secrets). secrets — `sklp config set -s prod -secret NAME value`: BACKUP_S3_ACCESS_KEY, BACKUP_S3_SECRET_KEY, MASTER_KEY, POSTGRES_PASSWORD, REGISTRY_PASSWORD, SMTP_PASSWORD; settings — `sklp config set -s prod NAME value`: ACME_EMAIL, BACKUP_S3_REGION, BACKUP_S3_URL, REGISTRY_USERNAME
version: 1
kind: deploy
name: prod

registries:
  rg.fr-par.scw.cloud:
    username: ${REGISTRY_USERNAME}
    password: ${REGISTRY_PASSWORD}

gateway:
  email: ${ACME_EMAIL}

services:
  # import: CloudNativePG Cluster postgres became the official postgres:17 image, named after its read-write Service postgres-rw; the postgres-ro and postgres-r addresses are rewritten to it
  # import: 2 instances became one: a node runs a single postgres, without replicas
  # import: volumes: the cluster's 10Gi volume data is not copied: pg_dump it from the cluster and restore it before switching traffic
  # import: backup: the cluster's WAL archiving to object storage is replaced by the nightly pg_dump below
  # import: backup: a nightly pg_dump is streamed to BACKUP_S3_URL (https://<endpoint>/<bucket>/<prefix>/); the source had none
  postgres-rw:
    image: postgres:17
    command: [postgres, -c, max_connections=100, -c, shared_buffers=256MB]
    port: 5432
    env:
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${BACKUP_S3_REGION}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_KEY}
      POSTGRES_DB: acme
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: acme
      SKLP_BACKUP_TO: ${BACKUP_S3_URL}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    resources:
      cpu: 500m
      memory: 1Gi
    ready:
      log: database system is ready to accept connections
      timeout: 120s
    backup:
      schedule: 0 3 * * *
      command: [sh, -c, exec pg_dump -Fc -U "$POSTGRES_USER" "$POSTGRES_DB"]

  # import: envFrom: ConfigMap acme-config inlined
  # import: env: SMTP_PASSWORD was optional; sklp deploy requires every ${VAR} — set it to an empty value if unused
  # import: env: POD_NAME (the pod name) is now the service name
  # import: ready: taken from the readinessProbe
  # import: resources: no limit was set: the request is used as the limit
  # import: securityContext: runAsUser/runAsGroup/fsGroup dropped: the service runs as the image's user inside a rootless user namespace
  # import: depends_on: inferred from the addresses it calls: postgres-rw, acme-nats
  acme-core:
    image: rg.fr-par.scw.cloud/acme/core:20261120-0915-4a1b2c3
    port: 4100
    env:
      DATABASE_URL: postgresql://acme:${POSTGRES_PASSWORD}@postgres-rw:5432/acme
      LOG_LEVEL: info
      MASTER_KEY: ${MASTER_KEY}
      NATS_URL: nats://acme-nats:4222
      POD_NAME: acme-core
      PORT: "4100"
      PUBLIC_URL: https://acme.test
      SMTP_PASSWORD: ${SMTP_PASSWORD}
    depends_on: [acme-core-migrate, postgres-rw, acme-nats]
    resources:
      cpu: 250m
      memory: 512Mi
    ready:
      http: http://localhost:4100/health
      timeout: 30s

  # import: ready: taken from the livenessProbe
  # import: port: Service acme-web listened on 80 and forwarded to 3000: inside the space it is reached at acme-web:3000, and the addresses in env were rewritten
  # import: depends_on: inferred from the addresses it calls: acme-core
  acme-web:
    image: rg.fr-par.scw.cloud/acme/web:20261120-0915-4a1b2c3
    replicas: 2
    port: 3000
    env:
      CORE_URL: http://acme-core:4100
      NODE_ENV: production
    depends_on: [acme-core]
    ready:
      tcp: localhost:3000
      timeout: 30s

  # import: volumes: volumeClaimTemplate data is the named volume acme-nats-data; the PVC data is not copied
  # TODO(import): backup: volume(s) acme-nats-data hold this service's data and nothing backs them up: add a backup: block (a command writing an archive to stdout + a cron schedule) and SKLP_BACKUP_TO in env
  acme-nats:
    image: nats:2.12-alpine
    command: [-js, -sd, /data]
    port: 4222
    volumes:
      - acme-nats-data:/data
    ready:
      log: Server is ready
      timeout: 120s

jobs:
  # TODO(import): schedule: the CronJob ran in time zone Europe/Paris; the node fires schedules in its own clock — shift the hours if they differ
  # import: depends_on: inferred from the addresses it calls: acme-core
  digest:
    image: rg.fr-par.scw.cloud/acme/core:20261120-0915-4a1b2c3
    command: [digest, --core, 'http://acme-core:4100']
    schedule: 0 7 * * *
    depends_on: [acme-core]

  # import: securityContext: runAsUser/runAsGroup/fsGroup dropped: the service runs as the image's user inside a rootless user namespace
  # import: jobs: was an init container of Deployment/core: it now runs once as a job acme-core waits for
  # import: depends_on: inferred from the addresses it calls: postgres-rw
  acme-core-migrate:
    image: rg.fr-par.scw.cloud/acme/migrate:20261120-0915-4a1b2c3
    command: [-path, /migrations, -database, 'postgresql://acme:${POSTGRES_PASSWORD}@postgres-rw:5432/acme', up]
    env:
      DATABASE_URL: postgresql://acme:${POSTGRES_PASSWORD}@postgres-rw:5432/acme
    depends_on: [postgres-rw]

spaces:
  k8s-kustomize-production:
    gateway:
      routes:
        - service: acme-core
          host: acme.test
          path: /api
          security_headers: true
        - service: acme-web
          host: acme.test
          security_headers: true
          compress: true
        - service: acme-web
          host: www.acme.test
          security_headers: true
          compress: true
