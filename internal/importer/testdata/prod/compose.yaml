services:
  traefik:
    image: traefik:v3.1
    command: ["--providers.docker", "--entrypoints.websecure.address=:443"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  app:
    image: ghcr.io/acme/shop:${APP_TAG:-1.4.2}
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://shop:${MYSQL_PASSWORD}@db:3306/shop
      SESSION_SECRET: ${SESSION_SECRET:-dev-only}
      PUBLIC_URL: https://${DOMAIN}
      WORKERS: ${WORKERS:-4}
      CACHE_TTL: ${CACHE_TTL:+300}
    command: ["sh", "-c", "exec shop serve --workers $${WORKERS} --port 8000"]
    labels:
      - traefik.enable=true
      - traefik.http.routers.shop.rule=Host(`shop.acme.test`) || Host(`www.acme.test`)
      - traefik.http.services.shop.loadbalancer.server.port=8000
    depends_on:
      db:
        condition: service_healthy
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
      restart_policy:
        condition: on-failure

  admin:
    image: ghcr.io/acme/shop-admin:1.4.2
    labels:
      caddy: admin.acme.test
      caddy.reverse_proxy: "{{upstreams 9000}}"
    expose: ["9000"]
    mem_limit: 1g

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: shop
      MYSQL_USER: shop
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]

  voice:
    image: ghcr.io/acme/voice:2.0.0
    ports:
      - "7882:7882/udp"
    cap_add: [NET_RAW]

  adminer:
    image: adminer:4
    profiles: [debug]
    ports: ["8081:8080"]

volumes:
  dbdata:
