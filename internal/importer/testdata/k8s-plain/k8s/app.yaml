apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
type: Opaque
stringData:
  API_TOKEN: hunter2
  DB_PASSWORD: s3cret
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  type: LoadBalancer
  selector:
    app: api
  ports:
    - name: http
      port: 80
      targetPort: 8080
    - name: metrics
      port: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      nodeSelector:
        pool: apps
      volumes:
        - name: cache
          emptyDir: {}
        - name: config
          configMap:
            name: api-files
      containers:
        - name: api
          image: ghcr.io/acme/api:2.3.1
          command: ["/bin/api"]
          args: ["serve", "--listen", ":8080"]
          ports:
            - containerPort: 8080
            - containerPort: 9090
          envFrom:
            - secretRef:
                name: app-secrets
          env:
            - name: CACHE_DIR
              value: /cache
            - name: TEMPLATE
              value: "hello ${USER}"
            - name: GREETING
              value: "$(CACHE_DIR)/greeting"
          volumeMounts:
            - name: cache
              mountPath: /cache
            - name: config
              mountPath: /etc/api
          securityContext:
            capabilities:
              add: [NET_BIND_SERVICE]
          livenessProbe:
            exec:
              command: ["/bin/api", "health"]
        - name: proxy
          image: envoyproxy/envoy:v1.31.0
          ports:
            - containerPort: 10000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 10
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  tls:
    - hosts: [api.acme.test]
      secretName: api-tls
  rules:
    - host: api.acme.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: docs
spec:
  hostnames: [docs.acme.test]
  rules:
    - backendRefs:
        - name: docs
          port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: docs
spec:
  selector:
    app: docs
  ports:
    - port: 80
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docs
spec:
  selector:
    matchLabels:
      app: docs
  template:
    metadata:
      labels:
        app: docs
    spec:
      containers:
        - name: docs
          image: ghcr.io/acme/docs:latest
          ports:
            - containerPort: 8000
---
apiVersion: monitoring.example.com/v1
kind: Dashboard
metadata:
  name: api
spec: {}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: seed
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: seed
          image: ghcr.io/acme/api:2.3.1
          args: ["seed", "--api", "http://api:80"]
