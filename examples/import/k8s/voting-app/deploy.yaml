# Imported for production from source by `sklp init -from k8s -to deploy`.
# 6 manual action(s) left: grep TODO(import). Lines marked import: record a translation choice.
# import: gateway: the node gateway terminates TLS for every route with a Let's Encrypt certificate requested for ACME_EMAIL; point each route host's DNS at the node
# import: spaces: routes live in space voting-app-production: rename it to the space this deploy should own
# TODO(import): variables: sklp deploy refuses to start while one of these is unset (a git reconcile reads them from the Skalpai project secrets). secrets — `sklp config set -s prod -secret NAME value`: BACKUP_S3_ACCESS_KEY, BACKUP_S3_SECRET_KEY, POSTGRES_PASSWORD (the source wrote a value for it; never reuse that one in production); settings — `sklp config set -s prod NAME value`: ACME_EMAIL, BACKUP_S3_REGION, BACKUP_S3_URL
version: 1
kind: deploy
name: prod

gateway:
  email: ${ACME_EMAIL}

services:
  # import: env: POSTGRES_PASSWORD was written in clear in the manifest: it is now ${POSTGRES_PASSWORD}, a secret to set per deployment
  # import: volumes: emptyDir db-data is the named volume db-data: unlike the emptyDir it survives a restart
  # import: backup: a nightly pg_dump is streamed to BACKUP_S3_URL (https://<endpoint>/<bucket>/<prefix>/); the source had none
  db:
    image: postgres:15-alpine
    port: 5432
    env:
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${BACKUP_S3_REGION}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_KEY}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: postgres
      SKLP_BACKUP_TO: ${BACKUP_S3_URL}
    volumes:
      - db-data:/var/lib/postgresql/data
    ready:
      log: database system is ready to accept connections
      timeout: 120s
    backup:
      schedule: 0 3 * * *
      command: [sh, -c, exec pg_dump -Fc -U "$POSTGRES_USER" "$POSTGRES_USER"]

  # import: volumes: emptyDir redis-data is the named volume redis-data: unlike the emptyDir it survives a restart
  redis:
    image: redis:alpine
    port: 6379
    volumes:
      - redis-data:/data
    ready:
      log: Ready to accept connections
      timeout: 120s

  # TODO(import): image: dockersamples/examplevotingapp_result is not pinned: production must name an exact version (a rollout only changes what the file says)
  # import: port: Service result listened on 8081 and forwarded to 80: inside the space it is reached at result:80, and the addresses in env were rewritten
  # TODO(import): routes: the NodePort Service exposed HTTP port 8081: it becomes a gateway route — set its public hostname under spaces:
  # import: ready: no healthcheck: a TCP probe on port 80 gates rollouts, and it passes as soon as the port opens — set ready.http to a health endpoint
  result:
    image: dockersamples/examplevotingapp_result
    port: 80
    ready:
      tcp: localhost:80
      timeout: 60s

  # TODO(import): image: dockersamples/examplevotingapp_vote is not pinned: production must name an exact version (a rollout only changes what the file says)
  # import: port: Service vote listened on 8080 and forwarded to 80: inside the space it is reached at vote:80, and the addresses in env were rewritten
  # TODO(import): routes: the NodePort Service exposed HTTP port 8080: it becomes a gateway route — set its public hostname under spaces:
  # import: ready: no healthcheck: a TCP probe on port 80 gates rollouts, and it passes as soon as the port opens — set ready.http to a health endpoint
  vote:
    image: dockersamples/examplevotingapp_vote
    port: 80
    ready:
      tcp: localhost:80
      timeout: 60s

  # TODO(import): image: dockersamples/examplevotingapp_worker is not pinned: production must name an exact version (a rollout only changes what the file says)
  worker:
    image: dockersamples/examplevotingapp_worker

spaces:
  voting-app-production:
    gateway:
      routes:
        - service: result
          host: result.example.com
        - service: vote
          host: vote.example.com
