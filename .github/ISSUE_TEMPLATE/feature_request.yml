name: Feature request
description: Propose a change or an addition.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what blocks you today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you would like it to work. A sketch of the command or YAML is enough.
    validations:
      required: true
  - type: dropdown
    id: pr
    attributes:
      label: Would you open a pull request for it?
      options: ["Yes", "No", "Maybe, with guidance"]
